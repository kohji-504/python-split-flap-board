function abbreviate(n){return n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)}
async function fetchRanking(){
 status.textContent='最新の公開ランキングを取得中…';
 try{
  const response=await fetch(DATA_URL,{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);

  if(!Array.isArray(json.rows)||json.rows.length<8)throw Error('データ形式が不正');

  if(top.some(r=>!r.project||!Number.isFinite(Number(r.download_count))))throw Error('データ項目が不足');

const rows=Array.from({length:8},(_,i)=>{let row=document.createElement('div');row.className='board-row';let cells=['rank','lib','kind','change'].map(cls=>{let c=document.createElement('div');c.className='cell '+cls;for(const part of ['top','bottom']){const face=document.createElement('div');face.className='flap-face '+part;const text=document.createElement('span');text.className='flap-text';face.append(text);c.append(face)}const moving=document.createElement('div');moving.className='flap-moving';const t=document.createElement('span');t.className='flap-text';moving.append(t);c.append(moving);const pair=document.createElement('div');pair.className='hinge-pair';pair.setAttribute('aria-hidden','true');for(let h=0;h<2;h++){const ring=document.createElement('i');ring.className='hinge';pair.append(ring)}c.append(pair);row.append(c);return c});board.append(row);return cells});
function styleChange(el,cell,value){el.classList.remove('up','down','same');if(cell.classList.contains('change'))el.classList.add(value.startsWith('↑')?'up':value.startsWith('↓')?'down':'same')}

// Browsers allow audio only after an explicit user click.
async function activateSound(){
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return false;
  if(!audioCtx)audioCtx=new AudioCtor();
  if(audioCtx.state==='suspended')await audioCtx.resume();
  return audioCtx.state==='running';
}
// Mechanical audio is synthesized: hinge click, plastic/card impact, and a faint spring rattle.
// Short filtered noise bursts and damped resonances emulate physical split-flap machinery.
let soundLevel=.75, soundCounter=0;
function noiseBurst(at, {length=.04, cutoff=1800, q=.65, amount=.3, lowpass=false}={}) {
 const sr=audioCtx.sampleRate, count=Math.max(64,Math.floor(sr*length));
 const buf=audioCtx.createBuffer(1,count,sr), d=buf.getChannelData(0);
 let prev=0;for(let i=0;i<count;i++){
   const white=Math.random()*2-1;prev=prev*.58+white*.42;
   const env=Math.pow(1-i/count,3.6)*(1-Math.exp(-i/17));
   d[i]=(white*.58+prev*.42)*env;
 }
 const source=audioCtx.createBufferSource();source.buffer=buf;
 const filter=audioCtx.createBiquadFilter();filter.type=lowpass?'lowpass':'bandpass';
 filter.frequency.value=cutoff;filter.Q.value=q;
 const gain=audioCtx.createGain();gain.gain.value=amount*soundLevel;
 source.connect(filter).connect(gain).connect(audioCtx.destination);
 source.start(at);source.stop(at+length+.003);
}
function resonance(at, frequency, strength, duration){
 const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
 osc.type='triangle';osc.frequency.setValueAtTime(frequency,at);
 osc.frequency.exponentialRampToValueAtTime(Math.max(40,frequency*.58),at+duration);
 gain.gain.setValueAtTime(.001,at);
 gain.gain.linearRampToValueAtTime(strength*soundLevel,at+.002);
 gain.gain.exponentialRampToValueAtTime(.001,at+duration);
 osc.connect(gain).connect(audioCtx.destination);
 osc.start(at);osc.stop(at+duration+.002);
}
function tick(){
 if(!audioOn||!audioCtx||audioCtx.state!=='running')return;
 const t=audioCtx.currentTime+.008;
 const drift=(++soundCounter%5-2)*.0025;
 // 1. hinge pawl, a small dry click as the top blade releases
 noiseBurst(t,{length:.017,cutoff:3500,amount:.22});
 resonance(t,620,.035,.017);
 // 2. broad low, hollow contact when the blade hits its stop
 const stop=t+.075+drift;
 noiseBurst(stop,{length:.072,cutoff:1250,amount:.66});
 noiseBurst(stop+.004,{length:.031,cutoff:4000,amount:.20});
 resonance(stop,205,.15,.079);
 resonance(stop+.007,410,.05,.043);
 // 3. a loose mechanical catch rattles once after contact
 noiseBurst(stop+.046,{length:.014,cutoff:2600,amount:.095});
}
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function flipCell(cell,target,stepMs,steps){
 const old=cell.dataset.value;
 const symbols=cell.classList.contains('rank')?['01','02','03','04','05','06','07','08','09']:
   cell.classList.contains('change')?['1.2B','800M','500M','950M','2.0B']:
   cell.classList.contains('kind')?['数値計算','データ分析','Web開発','テスト','DB操作']:
   ['numpy','pandas','requests','pytest','flask','fastapi','polars','django'];
 for(let n=0;n<steps;n++){
   const nextVal=n===steps-1?target:symbols[(n+Math.floor(Math.random()*symbols.length))%symbols.length];
   const moving=cell.querySelector('.flap-moving .flap-text');moving.textContent=cell.dataset.value;styleChange(moving,cell,cell.dataset.value);
   cell.style.setProperty('--flip-ms',Math.floor(stepMs*.76)+'ms');
   cell.classList.remove('flipping');void cell.offsetWidth;
   cell.classList.add('flipping');tick();
   // Lower part NEVER rotates. It changes its printed face when the upper plate falls.
   await sleep(Math.floor(stepMs*.76));
   cell.classList.remove('flipping');setCell(cell,nextVal);
   await sleep(Math.ceil(stepMs*.24));
 }
}
async function next(){
 if(busy)return;busy=true;
 document.getElementById('next').disabled=true;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(reduced)render();
 else{
  const ms=stepDuration;
  for(let i=0;i<rows.length;i++){
   const values=[String(i+1).padStart(2,'0'),...entries[i]];
   const jobs=[];
   rows[i].forEach((cell,j)=>{
     // 名前とDL数を中心に演出。各板の回数を変える（長め 5〜12枚）。
     const steps=5+Math.floor(Math.random()*8);
     const delayed=Math.floor(Math.random()*Math.min(140,ms*.7));
     const cellMs=Math.round(ms*(.9+Math.random()*.22));
     jobs.push((async()=>{await sleep(delayed);await flipCell(cell,values[j],cellMs,steps)})());
   });
   await Promise.all(jobs);
   if(i<rows.length-1)await sleep(Math.max(100,Math.round(ms*.6)));
  }
  document.getElementById('edition').textContent='MONTHLY TOP 8';
 }
 busy=false;document.getElementById('next').disabled=false;
}
document.getElementById('next').onclick=next;
document.getElementById('refresh').onclick=fetchRanking;
document.getElementById('auto').onclick=function(){if(timer){clearInterval(timer);timer=null;this.textContent='▶ 自動切替';this.setAttribute('aria-pressed','false')}else{timer=setInterval(next,60000);this.textContent='Ⅱ 自動停止';this.setAttribute('aria-pressed','true')}};
document.getElementById('sound').onclick=async function(){
 if(audioOn){audioOn=false;this.textContent='🔇 音をON'}
 else{try{audioOn=await activateSound()}catch(e){audioOn=false}this.textContent=audioOn?'🔊 音 ON':'🔇 音を使えません';if(audioOn){tick();setTimeout(tick,280);setTimeout(tick,560)}}
 this.setAttribute('aria-pressed',String(audioOn));
};
document.getElementById('volume').oninput=e=>{soundLevel=Number(e.target.value)/100};
document.getElementById('test').onclick=async()=>{if(!audioOn){try{audioOn=await activateSound()}catch(e){audioOn=false}; const btn=document.getElementById('sound');btn.textContent=audioOn?'🔊 音 ON':'🔇 音を使えません';btn.setAttribute('aria-pressed',String(audioOn))}if(audioOn){tick();setTimeout(tick,330);setTimeout(tick,660)}};
document.getElementById('speed').oninput=e=>{stepDuration=Number(e.target.value);document.getElementById('speedText').value=stepDuration+'ms'};
render();
// 初期表示はすぐ数値を表示。オンライン再取得は手動ボタンで実行。
</script>
